[project]
name = "quantum-lab-agent"
version = "0.1.0"
description = "Bounded classical LLM orchestration for local quantum simulation and QEC experiments"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "JiuYang"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "matplotlib>=3.10,<4",
    "pydantic>=2.10,<3",
    "pylatexenc>=2.10,<3",
    "python-dotenv>=1,<2",
    "qiskit==2.5.2",
    "qiskit-aer==0.17.2",
]

[project.scripts]
qla = "quantum_lab_agent.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
